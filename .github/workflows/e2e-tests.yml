name: e2e-tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  selenium:
    name: Selenium WebDriver E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sih-project/package-lock.json

      - name: Install Frontend Dependencies & Start Server
        run: |
          cd sih-project
          npm ci
          npm start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Install Python Test Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Selenium Test Suite
        run: |
          pytest -n auto --html=report.html --self-contained-html
        env:
          HEADLESS: "true"
          BASE_URL: "http://localhost:3000"

      - name: Upload Test Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-test-report
          path: |
            report.html
            artifacts/
